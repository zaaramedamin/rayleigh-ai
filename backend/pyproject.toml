[project]
name = "reyleight-backend"
version = "0.1.0"
description = "Reyleight: local-first personal knowledge assistant (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "sentence-transformers",
    "qdrant-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# backend/alembic/ is the migrations folder; the `alembic` import is the third-party library.
known-third-party = ["alembic"]
